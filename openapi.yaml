                  latitude: "40.76473"
                  longitude: "-74.00084"
                  country_name: "United States"
                  state_prov: "New York"
                  city: "New York"
                  locality: "Midtown West"
                  elevation: "9"
                astronomy:
                  - date: "2026-03-18"
