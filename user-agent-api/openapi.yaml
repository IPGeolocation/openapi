components:
  parameters:
    ApiKey:
      name: apiKey
      in: query
      required: false
      description: |
        Your IPGeolocation API key. Required unless Request Origin (CORS) authentication
        is configured for your domain on a paid plan. Get your key from the
        [IPGeolocation dashboard](https://app.ipgeolocation.io/).
      schema:
        type: string
      example: "YOUR_API_KEY"

    Output:
      name: output
      in: query
      required: false
      description: |
        Desired response format. Defaults to `json` if not specified. You can also
        control the format using the `Accept` header (`application/json`,
        `application/xml`, or `text/xml`). For successful responses and authentication
        errors, the `Accept` header takes precedence if both are provided: `output` is
        used only when the `Accept` header is absent or set to `*/*`, and an `Accept`
        value other than `application/xml` or `text/xml` (for example a browser's
        default) returns JSON even with `output=xml`. Values are matched exactly (use
        lowercase `xml`).

        If `output` is unknown or unsupported, it is ignored and the response defaults
        to JSON (`application/json`) with HTTP 200.
      schema:
        type: string
        enum: [json, xml]
        default: json

  responses:
    BadRequest:
      description: |
        Bad Request. Returned for one of the following reasons:
        - Special characters [ ] { } | ^ ` are passed in the API URL (either in parameters or values), especially in the API key.
        - The `uaString` is empty or null when calling `/v3/user-agent`(POST).
        - The JSON body has no `uaStrings` field (or it is `null`) when calling
          `/v3/user-agent-bulk`. An empty array is not an error: it returns HTTP 200
          with `[]` and 0 credits.
        - The `uaStrings` array contains a `null` or blank entry when calling
          `/v3/user-agent-bulk` (`'userAgentString' must not be empty or null`). The whole
          request fails and nothing is charged.
        - More than 50,000 user agent strings are provided in a single bulk request.
        - The request body is not valid JSON (`Malformed JSON request or invalid field`) or
          `uaStrings` is not a JSON array of strings.
        - No `User-Agent` header is present when calling `GET /v3/user-agent`. Unlike the
          POST body, there is no alternative way to supply the string for this call, so a
          missing/blank header always fails validation.

        Request body validation (malformed JSON, a missing or blank `uaString`, a missing
        `uaStrings` field, more than 50,000 entries) runs before the API key is checked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            specialCharacters:
              summary: Invalid special characters in request
              value:
                message: "Invalid character found in the request target."
            emptyUaString:
              summary: Empty or null user agent string
              value:
                message: "User-Agent string must not be blank"
            missingUaStringHeader:
              summary: Missing User-Agent header on GET
              value:
                message: "'userAgentString' must not be empty or null"
            emptyBulkList:
              summary: Missing uaStrings field
              value:
                message: "User-Agent strings for bulk lookup are missing"
            blankBulkEntry:
              summary: Null or blank entry in uaStrings
              value:
                message: "'userAgentString' must not be empty or null"
            malformedJson:
              summary: Request body is not valid JSON
              value:
                message: "Malformed JSON request or invalid field"
            uaStringsNotArray:
              summary: uaStrings is not a JSON array of strings
              value:
                message: "'uaStrings' must be a JSON array of strings, e.g. {\"uaStrings\": [\"value1\", \"value2\"]}"
            bulkLimitExceeded:
              summary: More than 50,000 strings in bulk request
              value:
                message: "No. of lookup queries cannot be more than 50000"

    Unauthorized:
      description: |
        Unauthorized. Returned for one of the following reasons:
        - An API key is required for this request, but the `apiKey` query parameter is missing and the request doesn't come from a domain added under Request Origin.
        - The provided API key is not valid, or the request has no API key and its `Origin` or `Referer` domain is not registered as a Request Origin.
        - The request is made using an API key of a database subscription.
        - The account's email address has not been verified.
        - The account has been locked due to abuse or illegal activity.
        - Requests are made after the subscription trial has expired.
        - The subscription is paused.
        - A paid feature is accessed using a free subscription.
        - The bulk user agent parsing endpoint is called using a free subscription API key.
        - The bulk user agent parsing endpoint is called using Request Origin (CORS) authentication. Bulk requests require an `apiKey`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingApiKey:
              summary: Missing API key
              value:
                message: "Please provide an API key (as 'apiKey=YOUR_API_KEY' URL parameter) to use IPGeolocation API. To get your free API Key, sign up at https://app.ipgeolocation.io/login"
            invalidApiKey:
              summary: Invalid API key
              value:
                message: "Provided API key is not valid. Contact technical support for assistance at support@ipgeolocation.io"
            databaseSubscriptionKey:
              summary: Database subscription API key used
              value:
                message: "You cannot query IPGeolocation API on a database plan subscription."
            unverifiedEmail:
              summary: Email address not verified
              value:
                message: "Please verify your email before using IPGeolocation API. Contact technical support for assistance at support@ipgeolocation.io"
            lockedAccount:
              summary: Account locked
              value:
                message: "Your account has been locked to use IPGeolocation API. Contact technical support for assistance at support@ipgeolocation.io"
            expiredTrial:
              summary: Subscription trial expired
              value:
                message: "Your subscription trial has been expired. Please subscribe to a paid plan to use IPGeolocation API."
            pausedSubscription:
              summary: Subscription is paused
              value:
                message: "Your subscription has been paused. Please resume your subscription to use IPGeolocation API."
            freePlanPaidFeature:
              summary: Paid feature accessed on free plan
              value:
                message: "Custom User-Agent lookup is not supported on your current subscription. This feature is available to all paid subscriptions only."
            bulkOnFreePlan:
              summary: Bulk endpoint called with free subscription key
              value:
                message: "Bulk User-Agent lookup is not supported on your current subscription. This feature is available to all paid subscriptions only."
            requestOriginBulk:
              summary: Bulk endpoint called with Request Origin authentication
              value:
                message: "Bulk queries are not allowed with request origins. Please use an API key to perform bulk queries."

    PaymentRequired:
      description: |
        Payment Required. Returned for a paid (non-Free) subscription whose active-until
        date has passed: one day after the active-until date for active or trialing
        subscriptions, and from the active-until date for past-due or deleted
        subscriptions. It is checked before any usage quota. Paused subscriptions and
        expired trials get HTTP 401 instead, and Free plan keys never get 402. Renew or
        upgrade the plan to continue using IPGeolocation API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            expiredSubscription:
              summary: Subscription expired
              value:
                message: "Your subscription has expired at 2026-01-15 00:00. Please subscribe to a paid plan to continue using IPGeolocation API without interruption or contact technical support for assistance at support@ipgeolocation.io"

    Forbidden:
      description: |
        Forbidden. The API key has an IP allow-list and the request comes from an IP address that is not on it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Your IP address '203.0.113.10' is not allowed to use this API key. Please contact technical support for assistance at support@ipgeolocation.io"

    NotFound:
      description: |
        Not Found. Returned when an invalid or non-existent endpoint is called.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "No endpoint GET /v3/user-agent-invalid."

    MethodNotAllowed:
      description: |
        Method Not Allowed. Returned when an unsupported HTTP method is used.

        - `/v3/user-agent` supports GET and POST.
        - `/v3/user-agent-bulk` supports POST only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            getNotAllowedForBulk:
              summary: GET used on bulk endpoint
              value:
                message: "Request method 'GET' is not supported"

    ContentTooLarge:
      description: |
        Content Too Large. Returned when the POST request payload exceeds
        the allowed size limit.
      content:
        text/html:
          schema:
            type: string
          example: |
            <html>
              <head>
                <title>413 Request Entity Too Large</title>
              </head>
              <body>
                <center><h1>413 Request Entity Too Large</h1></center>
                <hr><center>nginx/1.24.0 (Ubuntu)</center>
              </body>
            </html>

    UnsupportedMediaType:
      description: |
        Unsupported Media Type. Returned when the `Content-Type` header is not
        set to `application/json` for POST requests to:
        - `/v3/user-agent`
        - `/v3/user-agent-bulk`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Content-Type 'application/x-www-form-urlencoded' is not supported"

    TooManyRequests:
      description: |
        Too Many Requests. Returned for one of the following reasons:
        - The API credit allowance has been reached for a free subscription.
        - The API credit allowance has been reached for an active trial subscription (capped at 100,000 API credits).
        - The API credit allowance has been reached for a paid subscription with surcharge usage disabled.
        - The API credit allowance has been reached for a paid subscription with status 'past due' or 'deleted'.
        - The surcharge (overage) credit limit has been reached.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            usageLimitReached:
              summary: API credit limit reached
              value:
                message: "You have exceeded the limit of PLAN_REQUESTS_LIMIT requests per PLAN_INTERVAL for your subscribed 'PLAN_NAME' plan. Please throttle your requests or upgrade your plan to continue using IPGeolocation API without interruption."
            trialLimitReached:
              summary: Trial credit cap (100,000) reached
              value:
                message: "You have exceeded the limit of 100000 requests per PLAN_INTERVAL for your subscribed 'PLAN_NAME' plan. Please throttle your requests or upgrade your plan to continue using IPGeolocation API without interruption."
            surchargeLimitReached:
              summary: Surcharge usage limit reached
              value:
                message: "You have reached the surcharge amount limit of $SURCHARGE_AMOUNT_LIMIT on your subscribed 'PLAN_NAME' plan. Please throttle your requests or upgrade your plan to continue using IPGeolocation API without interruption."

    ClientClosedRequest:
      description: |
        Client Closed Request. Returned when the client sets a very short timeout,
        causing the connection to close before the server responds (logged by the
        edge proxy; the client receives no response). Increase the timeout on the
        client side.

    InternalServerError:
      description: |
        Internal Server Error. The server encountered an unexpected condition
        that prevented it from fulfilling the request. If the issue persists,
        contact support@ipgeolocation.io.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Something went wrong while processing your request. Please try again or contact technical support at support@ipgeolocation.io"
    BadGateway:
      description: |
        Bad Gateway. Returned by the edge proxy in front of the API, not by the API
        application, when it gets an invalid response from the API server. The
        response body is set by the proxy. This is usually temporary; retry the
        request.
    ServiceUnavailable:
      description: |
        Service Unavailable. Returned when the API cannot verify your API key (or request
        origin) because of a temporary internal error, for example when the billing service
        is unreachable and the key has not been verified recently. Keys that were verified
        recently keep working. Retry later; if it persists, contact support@ipgeolocation.io.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "We're unable to verify your API key (YOUR_API_KEY) due to an internal error. Please contact technical support for assistance at support@ipgeolocation.io"
    GatewayTimeout:
      description: |
        Gateway Timeout. Returned by the edge proxy in front of the API, not by the
        API application, when the API server does not respond in time. The response
        body is set by the proxy. Retry the request.
    HttpVersionNotSupported:
      description: |
        HTTP Version Not Supported. Returned by the edge proxy in front of the API,
        not by the API application, when the request uses an HTTP protocol version
        it does not support. The response body is set by the proxy.

  schemas:
    ErrorResponse:
      type: object
      description: |
        Returned for any non-200 response. Contains only a human-readable `message`.
        Message text can vary by status and condition; examples in this spec are
        representative, not exhaustive, and should not be treated as stable machine codes.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable explanation of what went wrong. Use HTTP status for control flow.
          example: "User-Agent string must not be blank"

    UserAgentResponse:
      type: object
      description: |
        Parsed user agent details including browser, device, layout engine, and
        operating system information. Also indicates bots, crawlers, or malicious
        user agent strings.
      properties:
        user_agent_string:
          type: string
          description: The raw user agent string that was parsed.
          example: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_11_2) AppleWebKit/601.3.9 (KHTML, like Gecko) Version/9.0.2 Safari/601.3.9"
        name:
          type: string
          description: |
            Name of the detected agent (e.g. browser name, bot name, or `"Hacker"`
            if the string is malformed or contains injected scripts).
          example: "Safari"
        type:
          type: string
          description: |
            Type of the detected user agent. See possible values in the documentation.
          example: "Browser"
        version:
          type: string
          description: Full version string of the detected agent.
          example: "9.0.2"
        version_major:
          type: string
          description: Major version of the detected agent.
          example: "9"
        device:
          $ref: "#/components/schemas/Device"
        engine:
          $ref: "#/components/schemas/Engine"
        operating_system:
          $ref: "#/components/schemas/OperatingSystem"

    Device:
      type: object
      description: Hardware device information extracted from the user agent string.
      properties:
        name:
          type: string
          description: Name of the device (e.g. model name or manufacturer).
          example: "Apple Macintosh"
        type:
          type: string
          description: |
            Type of the device. See possible values in the documentation.
          example: "Desktop"
        brand:
          type: string
          description: Brand or manufacturer of the device.
          example: "Apple"
        cpu:
          type: string
          description: CPU architecture or model of the device. May be `"Unknown"`.
          example: "Intel"

    Engine:
      type: object
      description: Layout engine information extracted from the user agent string.
      properties:
        name:
          type: string
          description: Name of the layout engine (e.g. `"AppleWebKit"`, `"Blink"`, `"Gecko"`).
          example: "AppleWebKit"
        type:
          type: string
          description: |
            Type of the layout engine. See possible values in the documentation.
          example: "Browser"
        version:
          type: string
          description: Full version string of the layout engine. May be `"??"` if unknown.
          example: "601.3.9"
        version_major:
          type: string
          description: Major version of the layout engine. May be `"??"` if unknown.
          example: "601"

    OperatingSystem:
      type: object
      description: Operating system information extracted from the user agent string.
      properties:
        name:
          type: string
          description: Name of the operating system.
          example: "Mac OS"
        type:
          type: string
          description: |
            Type of the operating system. See possible values in the documentation.
          example: "Desktop"
        version:
          type: string
          description: Full version string of the operating system. May be `"??"` if unknown.
          example: "10.11.2"
        version_major:
          type: string
          description: Major version of the operating system. May be `"??"` if unknown.
          example: "10.11"
        build:
          type: string
          description: Build identifier of the operating system. May be `"??"` if unknown.
          example: "??"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: query
      name: apiKey
      description: |
        API key passed as the `apiKey` query parameter. Get yours from the
        [IPGeolocation dashboard](https://app.ipgeolocation.io/). For client-side
        usage, consider using Request Origin (CORS) authentication instead to
        avoid exposing your key.

tags:
  - name: User Agent
    description: |
      API endpoints for parsing user agent strings into browser, device, layout engine,
      and operating system details. Supports single lookups via request header, custom
      string lookups via JSON body, and bulk parsing of up to 50,000 strings per request.
      Also detects bots, crawlers, and malicious or malformed user agent strings.
    externalDocs:
      description: User Agent API documentation
      url: https://ipgeolocation.io/documentation/user-agent-api.html
